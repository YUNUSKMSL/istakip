<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Melisa & Kerem Davetiye</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-cream: #f6efeb;
      --card-bg: #faf6f0;
      --gold-accent: #cfa86e;
      --gold-dark: #b58d52;
      --text-main: #5c4e4b;
      --text-sub: #8c7a76;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: #1a1615;
      font-family: 'Montserrat', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .mobile-wrapper {
      width: 100%;
      max-width: 414px;
      height: 100vh;
      max-height: 896px;
      background-color: var(--bg-cream);
      position: relative;
      box-shadow: 0 25px 50px rgba(0,0,0,0.6);
      border-radius: 36px;
      overflow-y: auto;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    /* --- AKORDİYON KAPAK KAPI MEKANİZMASI --- */
    .door-wrapper {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 100;
      display: flex;
      transition: opacity 1.2s ease 1.2s, visibility 1.2s ease 1.2s;
    }

    .door-wrapper.opened {
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
    }

    .door-leaf {
      width: 50%; height: 100%;
      background: #e8d7cd url('https://www.transparenttextures.com/patterns/pinstriped-suit.png');
      position: relative;
      transition: transform 1.4s cubic-bezier(0.77, 0, 0.175, 1);
      box-shadow: inset 0 0 20px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    /* Kabartma Dantel Efekti */
    .door-leaf::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle at center, rgba(255,255,255,0.6) 0%, transparent 70%);
      opacity: 0.5;
    }

    .door-left { border-right: 1px solid rgba(207, 168, 110, 0.4); }
    .door-right { border-left: 1px solid rgba(207, 168, 110, 0.4); }

    .door-wrapper.opened .door-left { transform: translateX(-100%); }
    .door-wrapper.opened .door-right { transform: translateX(100%); }

    /* Mühür Butonu */
    .seal-btn {
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      width: 90px; height: 90px;
      background: linear-gradient(145deg, #ffffff, #f2e6dc);
      border: 2px solid var(--gold-accent);
      border-radius: 50%;
      z-index: 101;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      transition: all 0.4s ease;
    }

    .seal-btn:hover {
      transform: translate(-50%, -50%) scale(1.08);
      box-shadow: 0 12px 30px rgba(207, 168, 110, 0.4);
    }

    .seal-btn img { width: 32px; height: 32px; opacity: 0.8; }
    .seal-btn span {
      font-family: 'Cormorant Garamond', serif;
      font-size: 11px;
      color: var(--text-main);
      letter-spacing: 2px;
      margin-top: 4px;
    }

    /* --- İÇERİK BÖLÜMÜ --- */
    .container {
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      gap: 35px;
    }

    .frame-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 35px 20px;
      text-align: center;
      position: relative;
      box-shadow: inset 0 0 15px rgba(207, 168, 110, 0.1), 0 8px 20px rgba(0,0,0,0.03);
      border: 1px solid rgba(207, 168, 110, 0.3);
    }

    /* Oval Çerçeve Detayı (Videodaki Gibi) */
    .frame-card::before {
      content: '';
      position: absolute;
      inset: 8px;
      border: 1px solid var(--gold-accent);
      border-radius: 14px;
      pointer-events: none;
      opacity: 0.6;
    }

    .couple-names {
      font-family: 'Alex Brush', cursive;
      font-size: 50px;
      color: var(--text-main);
      line-height: 1.1;
      margin: 10px 0;
    }

    .and-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      font-style: italic;
      color: var(--gold-accent);
      margin: -5px 0;
    }

    .quote {
      font-family: 'Cormorant Garamond', serif;
      font-size: 16px;
      color: var(--text-sub);
      font-style: italic;
      line-height: 1.6;
      margin-top: 15px;
    }

    .families {
      display: flex;
      justify-content: space-between;
      margin-top: 25px;
      padding-top: 15px;
      border-top: 1px solid rgba(207, 168, 110, 0.2);
      font-size: 12px;
      color: var(--text-main);
    }

    /* Tarih Rozeti */
    .date-number {
      font-family: 'Cormorant Garamond', serif;
      font-size: 72px;
      font-weight: 600;
      color: var(--gold-accent);
      line-height: 1;
    }

    .date-month {
      font-size: 14px;
      letter-spacing: 4px;
      color: var(--text-main);
      text-transform: uppercase;
      margin-bottom: 15px;
    }

    /* Geri Sayım */
    .timer-row {
      display: flex;
      justify-content: space-around;
      margin-top: 15px;
    }

    .time-block {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .time-block .val {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      font-weight: 600;
      color: var(--text-main);
    }

    .time-block .lbl {
      font-size: 10px;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* RSVP Form */
    .form-input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid rgba(207, 168, 110, 0.4);
      border-radius: 8px;
      background: #fff;
      font-family: inherit;
      font-size: 13px;
      color: var(--text-main);
      outline: none;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--gold-accent), var(--gold-dark));
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(207, 168, 110, 0.3);
    }
  </style>
</head>
<body>

  <div class="mobile-wrapper">
    
    <!-- AKORDİYON KAPAK -->
    <div class="door-wrapper" id="doors">
      <div class="door-leaf door-left"></div>
      <div class="seal-btn" id="openBtn">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#cfa86e" stroke-width="1.5">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
        <span>AÇINIZ</span>
      </div>
      <div class="door-leaf door-right"></div>
    </div>

    <!-- İÇERİK -->
    <div class="container">
      
      <!-- Gelin & Damat -->
      <div class="frame-card">
        <div class="couple-names" id="brideName">Melisa</div>
        <div class="and-text">ve</div>
        <div class="couple-names" id="groomName">Kerem</div>
        
        <p class="quote" id="invitationNote">
          "Bu anın şahidi olmanız için sizi yanımızda görmek istiyoruz."
        </p>

        <div class="families">
          <div><strong id="brideFamily">Yıldız</strong> Ailesi</div>
          <div><strong id="groomFamily">Demir</strong> Ailesi</div>
        </div>
      </div>

      <!-- Tarih -->
      <div class="frame-card">
        <div class="date-month" id="eventMonth">AĞUSTOS 2026</div>
        <div class="date-number" id="eventDay">08</div>
        <p style="font-size: 12px; color: var(--text-sub); letter-spacing: 2px;" id="eventTime">CUMARTESİ • 19:00</p>
      </div>

      <!-- Geri Sayım -->
      <div class="frame-card">
        <p style="font-size: 11px; letter-spacing: 2px; color: var(--text-sub); text-transform: uppercase;">Buluşmaya Kalan Süre</p>
        <div class="timer-row">
          <div class="time-block"><span class="val" id="d">00</span><span class="lbl">Gün</span></div>
          <div class="time-block"><span class="val" id="h">00</span><span class="lbl">Saat</span></div>
          <div class="time-block"><span class="val" id="m">00</span><span class="lbl">Dk</span></div>
          <div class="time-block"><span class="val" id="s">00</span><span class="lbl">Sn</span></div>
        </div>
      </div>

      <!-- LCV Formu -->
      <div class="frame-card">
        <p style="font-size: 11px; letter-spacing: 2px; color: var(--text-sub); text-transform: uppercase; margin-bottom: 15px;">Katılım Durumu (RSVP)</p>
        <form id="rsvpForm">
          <input type="text" id="guestName" class="form-input" placeholder="Adınız Soyadınız" required>
          <select id="guestStatus" class="form-input" required>
            <option value="Katılıyor">Katılıyorum</option>
            <option value="Katılamıyor">Maalesef Katılamıyorum</option>
          </select>
          <input type="number" id="guestCount" class="form-input" value="1" min="1" max="5" placeholder="Kişi Sayısı">
          <button type="submit" class="submit-btn">Gönder</button>
        </form>
      </div>

    </div>
  </div>

  <script>
    // Kapak Açımı
    document.getElementById('openBtn').addEventListener('click', () => {
      document.getElementById('doors').classList.add('opened');
    });

    // Admin Tarafından Dinamik Veri Yükleme (LocalStorage)
    function loadData() {
      const data = JSON.parse(localStorage.getItem('weddingConfig')) || {};
      if(data.bride) document.getElementById('brideName').innerText = data.bride;
      if(data.groom) document.getElementById('groomName').innerText = data.groom;
      if(data.bFamily) document.getElementById('brideFamily').innerText = data.bFamily;
      if(data.gFamily) document.getElementById('groomFamily').innerText = data.gFamily;
      if(data.note) document.getElementById('invitationNote').innerText = `"${data.note}"`;
      if(data.day) document.getElementById('eventDay').innerText = data.day;
      if(data.month) document.getElementById('eventMonth').innerText = data.month;
      if(data.time) document.getElementById('eventTime').innerText = data.time;
    }
    loadData();

    // Geri Sayım
    function startTimer() {
      const target = new Date('August 8, 2026 19:00:00').getTime();
      setInterval(() => {
        const now = new Date().getTime();
        const diff = target - now;
        if(diff > 0) {
          document.getElementById('d').innerText = Math.floor(diff / (1000 * 60 * 60 * 24));
          document.getElementById('h').innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
          document.getElementById('m').innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
          document.getElementById('s').innerText = Math.floor((diff % (1000 * 60)) / 1000);
        }
      }, 1000);
    }
    startTimer();

    // LCV Kayıt Formu
    document.getElementById('rsvpForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const newResponse = {
        name: document.getElementById('guestName').value,
        status: document.getElementById('guestStatus').value,
        count: document.getElementById('guestCount').value,
        date: new Date().toLocaleString()
      };
      
      const responses = JSON.parse(localStorage.getItem('rsvpList')) || [];
      responses.push(newResponse);
      localStorage.setItem('rsvpList', JSON.stringify(responses));
      
      alert('Talebiniz alınmıştır, teşekkür ederiz!');
      e.target.reset();
    });
  </script>
</body>
</html>
